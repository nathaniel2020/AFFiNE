name: Verify personal ChatGPT provider
on:
  push:
    branches: [codex/sign-in-with-chatgpt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgpt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: affine_siwc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      AFFINE_CHATGPT_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/affine_siwc_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - run: corepack enable && yarn install --immutable
      - run: bash scripts/verify-chatgpt.sh
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - uses: docker/setup-buildx-action@v3
      - name: Build local arm64 image (no publish or deploy)
        run: bash scripts/build-chatgpt-image.sh
      - name: Verify packaged runtime
        run: docker run --rm --entrypoint node affine-chatgpt:local -e "const n=require('./dist/server-native.node'); if(typeof n.BackendRuntime.prototype.chatgptCommand!=='function'||!n.AFFINE_PRO_PUBLIC_KEY) process.exit(1)"
      - name: Boot isolated server and verify authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f .docker/selfhost/compose.chatgpt-test.yml)
          trap '"${compose[@]}" logs --tail 60; "${compose[@]}" down' EXIT
          timeout 300 "${compose[@]}" up -d
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:13010/info
          node scripts/smoke-chatgpt-image.mjs
