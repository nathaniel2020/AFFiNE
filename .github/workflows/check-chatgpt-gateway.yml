name: Verify independent AI extension
on:
  push:
    branches: [codex/sign-in-with-chatgpt]
    paths:
      - 'packages/backend/chatgpt-gateway/**'
      - 'packages/backend/server/scripts/chatgpt/**'
      - 'scripts/build-chatgpt-gateway.sh'
      - '.github/workflows/check-chatgpt-gateway.yml'
      - 'yarn.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YARN_ENABLE_SCRIPTS: 'false'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - run: corepack enable
      - run: yarn workspaces focus @affine/chatgpt-gateway
      - run: yarn workspace @affine/chatgpt-gateway typecheck
      - run: yarn workspace @affine/chatgpt-gateway test
      - run: node --test packages/backend/server/scripts/chatgpt/oauth.test.mjs
      - run: yarn workspace @affine/chatgpt-gateway build
      - run: docker build -t affine-chatgpt-gateway:ci packages/backend/chatgpt-gateway
      - run: docker save affine-chatgpt-gateway:ci | gzip > ai-extension-image.tar.gz
      - name: Isolated container health and authentication smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker network create gateway-ci
          AFFINE_NETWORK=gateway-ci GATEWAY_IMAGE=affine-chatgpt-gateway:ci \
            docker compose -f packages/backend/chatgpt-gateway/compose.yml up -d --wait
          docker exec affine_ai_extension node -e "
            const assert=require('node:assert/strict');
            (async()=>{
              assert.equal((await fetch('http://127.0.0.1:8080/health')).status,200);
              assert.equal((await fetch('http://127.0.0.1:8080/v1/models')).status,401);
            })().catch(()=>process.exit(1));"
          printf '{"action":"status"}' | docker exec -i affine_ai_extension node /app/control.mjs
          AFFINE_NETWORK=gateway-ci GATEWAY_IMAGE=affine-chatgpt-gateway:ci \
            docker compose -f packages/backend/chatgpt-gateway/compose.yml down --volumes
      - uses: actions/upload-artifact@v4
        with:
          name: ai-extension-cli
          path: packages/backend/chatgpt-gateway/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ai-extension-image-linux-amd64
          path: ai-extension-image.tar.gz
          if-no-files-found: error
